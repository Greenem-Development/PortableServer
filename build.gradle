apply plugin: 'java'

group 'org.greenem.plugins.server'
version '3.0.0'

//sourceSets {
//        main.java.srcDirs = ['src']
//        main.resources.srcDirs = ['src']
//}
sourceSets {
    main {
        java {
            srcDirs 'src'
        }
        resources {
            srcDir 'resources' 
        }
    }
 }
    
repositories {
    mavenCentral()
    maven {
    	url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' 
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.18.1-R0.1-SNAPSHOT'
    implementation 'commons-io:commons-io:2.11.0'
}


jar {
	archiveBaseName = 'Server'
    destinationDirectory.set(file("G:/SERVERS/PortableServer 3.0/plugins"))
    configurations.implementation.canBeResolved=true
    from { configurations.implementation.collect {
      //it.canBeResolved = true 
      it.isDirectory() ? it : zipTree(it) } 
    }
    //with jar
}

task welcome {
    doLast {
        println configurations.each { i -> println i
        }
    }
}